<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';"><title>和 ChatGPT 娘聊聊</title><link rel="stylesheet" href="chat.css"></head><body><header><div><h1>ChatGPT 娘</h1><p>Live2D 桌面伙伴</p></div><button id="settings">连接设置</button></header><div class="toolbar"><span id="state">正在读取连接设置…</span><button id="clear">新对话</button></div><main id="messages" aria-live="polite"></main><form id="compose"><textarea id="input" placeholder="聊聊今天的想法…" maxlength="8000" aria-label="输入消息"></textarea><footer><small>Enter 发送 · Shift+Enter 换行</small><button id="send" class="primary">发送</button></footer></form><dialog id="config"><form id="config-form"><h2>连接你的 GPT</h2><p>使用 OpenAI API 聊天，API 用量由你的账户计费。保存设置后，首次发送消息时才验证连接。</p><label>OpenAI API Key<input id="key" type="password" autocomplete="off" placeholder="留空保留已保存的密钥"></label><label>模型名称<input id="model" required maxlength="150"></label><p class="small">密钥在本机使用 Windows DPAPI 加密；对话只保留在本次窗口中。每次发送会将最近 10 轮对话发给 OpenAI。</p><p id="config-error" class="error"></p><div class="buttons"><button type="button" id="cancel-config">取消</button><button class="primary">保存设置</button></div></form></dialog><script src="chat.js"></script></body></html>
